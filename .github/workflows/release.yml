name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          files: |
            apps/web/.next
            apps/admin/.next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: github.repository == 'your-org/barbershop-monorepo'
        run: |
          cd packages/ui && npm publish --access public
          cd packages/types && npm publish --access public
          cd packages/utils && npm publish --access public
          cd packages/web-hooks && npm publish --access public
          cd packages/payments && npm publish --access public
          cd packages/notifications && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/admin:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/admin:latest
            ghcr.io/${{ github.repository }}/socket:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/socket:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}