version: '3.8'

services:
  # ==================== DATABASE ====================
  postgres:
    image: postgres:15-alpine
    container_name: barbershop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barbershop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/prisma/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: barbershop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== WEB APP ====================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: runner
    container_name: barbershop-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/barbershop?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-secret-key}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3002
      # OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID}
      - APPLE_KEY_ID=${APPLE_KEY_ID}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY}
      # Payments
      - IYZICO_API_KEY=${IYZICO_API_KEY}
      - IYZICO_SECRET_KEY=${IYZICO_SECRET_KEY}
      - IYZICO_BASE_URL=https://sandbox-api.iyzipay.com
      # SMS
      - NETGSM_USERCODE=${NETGSM_USERCODE}
      - NETGSM_PASSWORD=${NETGSM_PASSWORD}
      - NETGSM_HEADER=${NETGSM_HEADER:-BRBRAL}
      # Push
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=mailto:admin@premiumbarber.com
      # Email
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=Premium Barber <noreply@premiumbarber.com>
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/web:/app/apps/web:ro
      - ./packages:/app/packages:ro
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app/apps/web
          ignore:
            - node_modules/
            - .next/
        - action: sync
          path: ./packages
          target: /app/packages
          ignore:
            - node_modules/
            - dist/

  # ==================== ADMIN APP ====================
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: runner
    container_name: barbershop-admin
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/barbershop?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-secret-key}
      - NEXTAUTH_URL=http://localhost:3001
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/admin:/app/apps/admin:ro
      - ./packages:/app/packages:ro
    develop:
      watch:
        - action: sync
          path: ./apps/admin
          target: /app/apps/admin
          ignore:
            - node_modules/
            - .next/
        - action: sync
          path: ./packages
          target: /app/packages
          ignore:
            - node_modules/
            - dist/

  # ==================== SOCKET SERVER ====================
  socket:
    build:
      context: ./socket-server
      dockerfile: Dockerfile
      target: runner
    container_name: barbershop-socket
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/barbershop?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-secret-key}
      - SOCKET_PORT=3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./socket-server:/app/socket-server:ro
      - ./packages:/app/packages:ro
    develop:
      watch:
        - action: sync
          path: ./socket-server
          target: /app/socket-server
          ignore:
            - node_modules/
            - dist/
        - action: sync
          path: ./packages
          target: /app/packages
          ignore:
            - node_modules/
            - dist/

  # ==================== PRISMA STUDIO ====================
  prisma-studio:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    container_name: barbershop-prisma-studio
    command: pnpm --filter=@barbershop/db db:studio
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/barbershop?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: barbershop-network